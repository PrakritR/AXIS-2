name: Vercel main-only guard

# Fail loudly if anyone recreates the legacy `production` branch. Production
# deploys must come only from `main` (see vercel.json + AGENTS.md).
on:
  push:
    branches:
      - production

jobs:
  reject-production-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Block legacy production branch
        run: |
          echo "::error::The production git branch is retired. Ship only via main."
          echo "Workflow: merge prakrit -> main, then git push origin main."
          echo "See AGENTS.md (Branching & deployment) and docs/agents/deployment-workflow.md."
          exit 1
