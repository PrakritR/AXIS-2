<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pricing — compact 4-section layout</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <style>
    :root {
      --pl-blue: #2f6bff;
      --pl-ink: #17181a;
      --pl-muted: #5c6068;
      --pl-line: rgba(8, 9, 11, 0.09);
    }
    body { font-family: system-ui, -apple-system, sans-serif; color: var(--pl-ink); background: #f7f8fa; }
    .section { border-top: 1px solid var(--pl-line); padding-top: 1.25rem; }
    .section:first-child { border-top: 0; padding-top: 0; }
    .fee-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 0.75rem; align-items: center; }
    .money { width: 7rem; padding-left: 1.5rem; }
    .panel { border: 1px solid var(--pl-line); border-radius: 0.75rem; background: #fff; padding: 0.75rem; }
  </style>
</head>
<body class="p-6 max-w-2xl mx-auto">
  <header class="mb-6">
    <p class="text-xs font-semibold uppercase tracking-wide text-[var(--pl-muted)]">PropLane · Manager listing wizard</p>
    <h1 class="text-xl font-bold mt-1">Pricing — compact layout (v3)</h1>
    <p class="text-sm text-[var(--pl-muted)] mt-1">One tab · four sections · checkboxes · minimal copy</p>
  </header>

  <div class="bg-white rounded-2xl border border-[var(--pl-line)] shadow-sm p-5 space-y-5">
    <!-- 1. Rental model -->
    <section class="section">
      <h2 class="text-sm font-semibold mb-2">1 · Rental model</h2>
      <label class="text-xs font-semibold block mb-1">How is this property rented?</label>
      <select class="select select-bordered select-sm w-full max-w-xs">
        <option>Entire place</option>
        <option selected>Shared — rent by room</option>
      </select>
    </section>

    <!-- 2. Short-term -->
    <section class="section">
      <h2 class="text-sm font-semibold mb-2">2 · Short-term rentals</h2>
      <label class="flex items-center gap-2 cursor-pointer text-sm font-medium">
        <input type="checkbox" class="checkbox checkbox-sm" checked /> Enable short-term rentals
      </label>
      <div class="panel mt-3 space-y-2">
        <div class="fee-row">
          <label class="flex items-center gap-2 text-sm"><input type="checkbox" class="checkbox checkbox-xs" /> Application fee</label>
        </div>
        <div class="fee-row">
          <label class="flex items-center gap-2 text-sm"><input type="checkbox" class="checkbox checkbox-xs" checked /> Security deposit</label>
          <div class="relative"><span class="absolute left-2 top-1/2 -translate-y-1/2 text-xs text-[var(--pl-muted)]">$</span><input class="input input-bordered input-sm money" value="200" /></div>
        </div>
        <div class="fee-row">
          <label class="flex items-center gap-2 text-sm"><input type="checkbox" class="checkbox checkbox-xs" checked /> Payment amount <span class="text-xs text-[var(--pl-muted)]">(nightly → stay total)</span></label>
          <div class="relative"><span class="absolute left-2 top-1/2 -translate-y-1/2 text-xs text-[var(--pl-muted)]">$</span><input class="input input-bordered input-sm money" value="85" /></div>
        </div>
        <div class="fee-row pt-1 border-t border-[var(--pl-line)]">
          <label class="flex items-center gap-2 text-sm"><input type="checkbox" class="checkbox checkbox-xs" /> Lease bundle for short-term stay</label>
        </div>
      </div>
    </section>

    <!-- 3. Rent -->
    <section class="section">
      <h2 class="text-sm font-semibold mb-2">3 · Rent</h2>
      <details class="panel" open>
        <summary class="text-sm font-medium cursor-pointer">Room 1 · $800/mo</summary>
        <div class="grid grid-cols-2 gap-2 mt-3 text-sm">
          <div><label class="text-xs font-semibold">Monthly rent</label><input class="input input-bordered input-sm w-full mt-1" value="800" /></div>
          <div><label class="text-xs font-semibold">Utilities</label><select class="select select-bordered select-sm w-full mt-1"><option>Manager billed</option></select></div>
        </div>
      </details>
      <details class="panel mt-2">
        <summary class="text-sm font-medium cursor-pointer">Room 2 · Rent not set</summary>
      </details>
      <p class="text-xs font-semibold mt-3 mb-1">Lease lengths</p>
      <div class="flex flex-wrap gap-2">
        <label class="label cursor-pointer gap-1 text-xs border rounded-lg px-2 py-1"><input type="checkbox" class="checkbox checkbox-xs" checked /> 12 months</label>
        <label class="label cursor-pointer gap-1 text-xs border rounded-lg px-2 py-1"><input type="checkbox" class="checkbox checkbox-xs" /> Month-to-month</label>
      </div>
    </section>

    <!-- 4. Fees -->
    <section class="section">
      <h2 class="text-sm font-semibold mb-2">4 · Fees</h2>
      <div class="grid grid-cols-2 gap-2 text-sm">
        <div><label class="text-xs font-semibold">Holding deposit</label><input class="input input-bordered input-sm w-full mt-1" value="100" /></div>
        <div><label class="text-xs font-semibold">Security deposit</label><input class="input input-bordered input-sm w-full mt-1" value="0" /></div>
        <div><label class="text-xs font-semibold">Move-in fee</label><input class="input input-bordered input-sm w-full mt-1" value="0" /></div>
        <div><label class="text-xs font-semibold">Parking (monthly)</label><input class="input input-bordered input-sm w-full mt-1" value="0" /></div>
        <div><label class="text-xs font-semibold">HOA / community</label><input class="input input-bordered input-sm w-full mt-1" value="0" /></div>
        <div><label class="text-xs font-semibold">Late fee</label><input class="input input-bordered input-sm w-full mt-1" value="50" /></div>
      </div>
      <p class="text-xs text-[var(--pl-muted)] mt-3">Payment methods: configured in <a href="#" class="text-[var(--pl-blue)] underline">Payments → Setup</a>.</p>
    </section>
  </div>
</body>
</html>
